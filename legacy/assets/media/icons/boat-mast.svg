<?xml version="1.0" encoding="UTF-8"?>
<!-- mask source: must stay white, not black/currentColor. Some browsers default an
     externally loaded mask image to luminance masking, not alpha masking — black
     scores 0% visible under luminance, white scores 100% under both modes. -->
