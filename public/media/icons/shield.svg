<?xml version="1.0" encoding="UTF-8"?>
<!-- mask source: must stay white, not black/currentColor. Some browsers default an
     externally loaded mask image to luminance masking, not alpha masking — black
     scores 0% visible under luminance, white scores 100% under both modes. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2.5 3.5 5v5c0 4 2.8 6.6 6.5 7.5 3.7-.9 6.5-3.5 6.5-7.5V5L10 2.5Z"/></svg>
