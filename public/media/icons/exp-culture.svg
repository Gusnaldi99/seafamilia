<?xml version="1.0" encoding="UTF-8"?>
<!-- mask source: must stay white, not black/currentColor. Some browsers default an
     externally loaded mask image to luminance masking, not alpha masking — black
     scores 0% visible under luminance, white scores 100% under both modes. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5h16M4 12h16M4 17.5h16"/><path d="M8.6 3v18M15.4 3v18"/></svg>
