<?xml version="1.0" encoding="UTF-8"?>
<!-- mask source: must stay white, not black/currentColor. Some browsers default an
     externally loaded mask image to luminance masking, not alpha masking — black
     scores 0% visible under luminance, white scores 100% under both modes. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#fff" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20h14l-2 3H7l-2-3Z"/><path d="M12 17V4M12 4 6 12h12L12 4Z"/></svg>
