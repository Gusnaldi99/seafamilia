<?xml version="1.0" encoding="UTF-8"?>
<!-- mask source: must stay white, not black/currentColor. Some browsers default an
     externally loaded mask image to luminance masking, not alpha masking — black
     scores 0% visible under luminance, white scores 100% under both modes. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 9.5c0 3.4-3.1 6.2-7 6.2-.8 0-1.6-.1-2.3-.3L4 17l1-2.7A6 6 0 0 1 3 9.5C3 6.1 6.1 3.3 10 3.3s7 2.8 7 6.2Z"/></svg>
